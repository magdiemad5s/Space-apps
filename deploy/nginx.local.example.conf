# LOCAL routing example only. Public hosting additionally requires authentication,
# authorization, HTTPS and protected history storage; see docs/WEB_DEPLOYMENT.md.
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root /absolute/path/to/Space-apps/frontend/dist/dashboard-angular/browser;
    index index.html;

    location /api/v1/ {
        # No URI suffix: preserve /api/v1 for the Express routes.
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 40s;
        client_max_body_size 100k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
