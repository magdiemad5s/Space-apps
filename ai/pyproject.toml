[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-shield-ml"
version = "0.1.0"
description = "Offline multimodal ASTRA-SHIELD synthetic-data demonstration models and API"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3,<3", "pandas>=2.2,<3", "scikit-learn==1.8.0", "joblib>=1.5,<2", "fastapi>=0.141,<1", "pydantic>=2.13,<3", "uvicorn>=0.52,<1", "xgboost-cpu==3.4.1", "shap==0.54.1"]

[project.optional-dependencies]
report = ["numpy==2.3.5", "pandas==2.2.3", "matplotlib==3.10.8", "reportlab==4.4.9", "Pillow==13.0.0"]

[tool.setuptools.packages.find]
include = ["astra_shield_ml*"]
